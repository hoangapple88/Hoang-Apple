<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hoang Apple</title>
    <style>
        /* ==========================================
           1. CẤU HÌNH BIẾN VÀ NỀN CARO (GRID TEXTURE)
           ========================================== */
        :root {
            --bg-color: #f4f6f9;
            --text-color: #1c1c1e;
            --card-bg: rgba(255, 255, 255, 0.85);
            --grid-color: rgba(0, 0, 0, 0.06);
            --header-bg: rgba(255, 255, 255, 0.8);
            --btn-bg: #e5e5ea;
            --btn-text: #000000;
            --accent-glow: rgba(0, 122, 255, 0.3);
            --menu-bg: #ffffff;
        }

        [data-theme="dark"] {
            --bg-color: #0f0f11;
            --text-color: #f2f2f7;
            --card-bg: rgba(28, 28, 30, 0.85);
            --grid-color: rgba(255, 255, 255, 0.05);
            --header-bg: rgba(28, 28, 30, 0.8);
            --btn-bg: #2c2c2e;
            --btn-text: #ffffff;
            --accent-glow: rgba(10, 132, 255, 0.3);
            --menu-bg: #1c1c1e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
            /* Tạo texture caro bằng Radial & Linear Gradient */
            background-image: 
                linear-gradient(var(--grid-color) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
            background-size: 20px 20px;
            overflow-x: hidden;
        }

        /* ==========================================
           2. HEADER & LOGO CENTER & MENU BUTTON
           ========================================== */
        header {
            position: sticky;
            top: 0;
            width: 100%;
            height: 60px;
            background: var(--header-bg);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 16px;
            z-index: 100;
            border-bottom: 1px solid var(--grid-color);
        }

        .menu-btn {
            position: absolute;
            left: 16px;
            font-size: 26px;
            background: none;
            border: none;
            color: var(--text-color);
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 8px;
            user-select: none;
        }

        .logo-container {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
        }

        .logo-img {
            max-height: 40px;
            width: auto;
            object-fit: contain;
        }

        /* ==========================================
           3. SIDE MENU TRƯỢT
           ========================================== */
        .menu-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.4);
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
            z-index: 200;
        }

        .menu-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .side-menu {
            position: fixed;
            top: 0;
            left: -300px;
            width: 280px;
            height: 100%;
            background: var(--menu-bg);
            z-index: 201;
            transition: left 0.3s cubic-bezier(0.1, 0.9, 0.2, 1);
            display: flex;
            flex-direction: column;
            box-shadow: 4px 0 15px rgba(0,0,0,0.15);
        }

        .side-menu.active {
            left: 0;
        }

        .menu-header {
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-bottom: 1px solid var(--grid-color);
        }

        .menu-nav {
            flex: 1;
            padding: 20px 0;
            display: flex;
            flex-direction: column;
        }

        .menu-item {
            padding: 14px 24px;
            color: var(--text-color);
            text-decoration: none;
            font-weight: 500;
            display: flex;
            align-items: center;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        .menu-item:hover, .menu-item.active {
            background: rgba(0, 122, 255, 0.1);
        }

        /* Controls cài đặt giao diện trong Menu */
        .settings-box {
            padding: 16px 20px;
            border-top: 1px solid var(--grid-color);
            background: rgba(0,0,0,0.02);
        }

        .setting-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
            font-size: 14px;
        }

        .setting-row:last-child {
            margin-bottom: 0;
        }

        /* Toggle switch */
        .switch {
            position: relative;
            display: inline-block;
            width: 44px;
            height: 24px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #ccc;
            transition: .3s;
            border-radius: 24px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .3s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: #34c759;
        }

        input:checked + .slider:before {
            transform: translateX(20px);
        }

        .menu-footer {
            padding: 16px;
            text-align: center;
            font-size: 13px;
            opacity: 0.7;
            border-top: 1px solid var(--grid-color);
        }

        /* ==========================================
           4. NỘI DUNG TRANG (PAGES)
           ========================================== */
        main {
            flex: 1;
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
            padding: 20px 16px 120px 16px; /* Đệm dưới để không bị mây che */
            position: relative;
            z-index: 10;
        }

        .page {
            display: none;
            animation: fadeIn 0.4s ease forwards;
        }

        .page.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Tiêu đề dùng chung */
        .page-title {
            text-align: center;
            margin-bottom: 20px;
            font-size: 20px;
        }

        .text-red {
            color: #ff3b30;
        }

        /* Gradient chữ Admin */
        .gradient-admin {
            background: linear-gradient(135deg, #007aff, #00f2fe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: bold;
        }

        /* Trang Hướng Dẫn - Video */
        .video-container {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%; /* Tỷ lệ 16:9 */
            height: 0;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
            background: #000;
        }

        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        /* Trang Hỗ Trợ - QR Zalo RGB */
        .qr-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 20px;
        }

        .rgb-box {
            position: relative;
            width: 250px;
            height: 250px;
            border-radius: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #fff;
            padding: 8px;
            /* Tạo viền RGB bằng gradient + animation */
            box-shadow: 0 0 15px rgba(0, 122, 255, 0.3);
        }

        .rgb-box::before {
            content: '';
            position: absolute;
            top: -3px; left: -3px; right: -3px; bottom: -3px;
            background: linear-gradient(45deg, #ff0000, #ff7300, #fffb00, #48ff00, #00ffd5, #002bfd, #7a00ff, #ff00c8, #ff0000);
            background-size: 400%;
            z-index: -1;
            filter: blur(5px);
            width: calc(100% + 6px);
            height: calc(100% + 6px);
            animation: glowingRGB 20s linear infinite;
            border-radius: 18px;
        }

        @keyframes glowingRGB {
            0% { background-position: 0 0; }
            50% { background-position: 400% 0; }
            100% { background-position: 0 0; }
        }

        .qr-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 10px;
        }

        /* ==========================================
           5. FOOTER WEB
           ========================================== */
        footer {
            text-align: center;
            padding: 20px;
            font-size: 14px;
            opacity: 0.8;
            margin-top: auto;
            position: relative;
            z-index: 10;
        }

        /* ==========================================
           6. HIỆU ỨNG TẾT TRUNG THU
           ========================================== */
        /* Nút có sắc đỏ khi bật Trung Thu */
        body.mid-autumn-mode .menu-btn,
        body.mid-autumn-mode .btn-custom {
            background-color: #d32f2f !important;
            color: #ffffff !important;
            box-shadow: 0 0 10px rgba(211, 47, 47, 0.5);
        }

        /* Cành cây & Lồng đèn (Góc trên) */
        .mid-autumn-decorations {
            display: none;
            pointer-events: none;
        }

        body.mid-autumn-mode .mid-autumn-decorations {
            display: block;
        }

        .tree-branch {
            position: fixed;
            top: 0;
            right: 0;
            width: 220px;
            height: auto;
            z-index: 99;
            pointer-events: none;
        }

        .lantern {
            position: fixed;
            top: 50px;
            right: 60px;
            width: 50px;
            height: auto;
            z-index: 99;
            animation: swing 3s ease-in-out infinite alternate;
            transform-origin: top center;
        }

        .lantern-left {
            left: 20px;
            right: auto;
            top: 60px;
            width: 40px;
            animation: swing 2.5s ease-in-out infinite alternate-reverse;
        }

        @keyframes swing {
            0% { transform: rotate(-8deg); }
            100% { transform: rotate(8deg); }
        }

        /* Đám mây gắn ở dưới cùng khung hình điện thoại/màn hình */
        .fixed-bottom-clouds {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100vw;
            height: 70px;
            pointer-events: none;
            z-index: 90;
            display: none;
        }

        body.mid-autumn-mode .fixed-bottom-clouds {
            display: block;
        }

        /* SVG Mây bay lượn nhẹ */
        .cloud-svg {
            position: absolute;
            bottom: -10px;
            width: 120%;
            left: -10%;
            fill: rgba(255, 235, 235, 0.85);
            filter: drop-shadow(0px -4px 6px rgba(212, 0, 0, 0.15));
            animation: cloudFloat 4s ease-in-out infinite alternate;
        }

        [data-theme="dark"] .cloud-svg {
            fill: rgba(60, 20, 20, 0.85);
        }

        @keyframes cloudFloat {
            0% { transform: translateY(0) scaleY(1); }
            100% { transform: translateY(-6px) scaleY(1.05); }
        }
    </style>
</head>
<body>

    <!-- HIỆU ỨNG TRUNG THU: CÀNH CÂY & LỒNG ĐÈN -->
    <div class="mid-autumn-decorations">
        <!-- SVG Cành cây trang trí góc trên phải -->
        <svg class="tree-branch" viewBox="0 0 200 150">
            <path d="M200,0 Q120,20 60,80 Q30,110 0,130" fill="none" stroke="#5d4037" stroke-width="5"/>
            <path d="M140,20 Q100,50 70,60" fill="none" stroke="#5d4037" stroke-width="3"/>
            <!-- Lá cây -->
            <circle cx="60" cy="80" r="6" fill="#2e7d32"/>
            <circle cx="70" cy="60" r="8" fill="#388e3c"/>
            <circle cx="30" cy="110" r="7" fill="#1b5e20"/>
            <circle cx="100" cy="50" r="6" fill="#2e7d32"/>
        </svg>

        <!-- Lồng đèn bên phải treo từ cành cây -->
        <svg class="lantern" viewBox="0 0 100 140">
            <line x1="50" y1="0" x2="50" y2="20" stroke="#ffd700" stroke-width="2"/>
            <rect x="35" y="20" width="30" height="8" fill="#b71c1c" rx="2"/>
            <ellipse cx="50" cy="65" rx="30" ry="40" fill="#d32f2f" stroke="#ffd700" stroke-width="2"/>
            <line x1="50" y1="25" x2="50" y2="105" stroke="#ffd700" stroke-width="1.5"/>
            <rect x="35" y="105" width="30" height="8" fill="#b71c1c" rx="2"/>
            <!-- Tua rua -->
            <line x1="50" y1="113" x2="50" y2="140" stroke="#ffd700" stroke-width="3"/>
            <line x1="42" y1="113" x2="42" y2="135" stroke="#d32f2f" stroke-width="2"/>
            <line x1="58" y1="113" x2="58" y2="135" stroke="#d32f2f" stroke-width="2"/>
        </svg>

        <!-- Lồng đèn phụ bên trái -->
        <svg class="lantern lantern-left" viewBox="0 0 100 140">
            <line x1="50" y1="0" x2="50" y2="20" stroke="#ffd700" stroke-width="2"/>
            <ellipse cx="50" cy="65" rx="25" ry="35" fill="#e53935" stroke="#ffd700" stroke-width="2"/>
            <line x1="50" y1="100" x2="50" y2="130" stroke="#ffd700" stroke-width="3"/>
        </svg>
    </div>

    <!-- HIỆU ỨNG TRUNG THU: ĐÁM MÂY DƯỚI CÙNG KHUNG HÌNH (ĐIỆN THOẠI / MÀN HÌNH) -->
    <div class="fixed-bottom-clouds">
        <svg class="cloud-svg" viewBox="0 0 1200 120" preserveAspectRatio="none">
            <path d="M0,120 L0,60 Q40,20 100,50 Q160,10 240,40 Q320,0 400,30 Q480,10 560,40 Q640,0 720,30 Q800,10 880,50 Q960,20 1040,60 Q1120,20 1200,60 L1200,120 Z"></path>
        </svg>
    </div>

    <!-- HEADER / LOGO CENTER / MENU BUTTON -->
    <header>
        <button class="menu-btn" id="openMenuBtn" aria-label="Open Menu">≡</button>
        <div class="logo-container">
            <img id="mainLogo" class="logo-img" src="./logo/logo-lightmode.png" alt="Website Logo">
        </div>
    </header>

    <!-- MENU SLIDE-OUT OVERLAY -->
    <div class="menu-overlay" id="menuOverlay"></div>
    <aside class="side-menu" id="sideMenu">
        <div class="menu-header">
            <img id="menuLogo" class="logo-img" src="./logo/logo-lightmode.png" alt="Menu Logo">
        </div>
        
        <nav class="menu-nav">
            <a class="menu-item active" onclick="switchPage('home')">Trang chủ</a>
            <a class="menu-item" onclick="switchPage('guide')">Hướng dẫn</a>
            <a class="menu-item" onclick="switchPage('support')">Hỗ trợ</a>
        </nav>

        <!-- MỤC CHỌN MODE VÀ HIỆU ỨNG TRUNG THU -->
        <div class="settings-box">
            <div class="setting-row">
                <span>Giao diện Tối (Dark)</span>
                <label class="switch">
                    <input type="checkbox" id="darkModeToggle">
                    <span class="slider"></span>
                </label>
            </div>
            <div class="setting-row">
                <span>Tết Trung Thu 🥮</span>
                <label class="switch">
                    <input type="checkbox" id="midAutumnToggle">
                    <span class="slider"></span>
                </label>
            </div>
        </div>

        <div class="menu-footer">
            2026 Hoang Apple 
        </div>
    </aside>

    <!-- NỘI DUNG CHÍNH CÁC TRANG -->
    <main>
        <!-- 1. TRANG CHỦ (Để trống theo yêu cầu) -->
        <section id="page-home" class="page active">
            <!-- Trang chủ để trống -->
        </section>

        <!-- 2. TRANG HƯỚNG DẪN -->
        <section id="page-guide" class="page">
            <h2 class="page-title">
                <b>Hướng dẫn gửi máy bằng <span class="text-red">Viettel Post</span></b>
            </h2>
            <div class="video-container">
                <iframe 
                    src="https://www.youtube.com/embed/qEQ6fbPHY8I" 
                    title="Hướng dẫn gửi máy bằng Viettel Post" 
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                    allowfullscreen>
                </iframe>
            </div>
        </section>

        <!-- 3. TRANG HỖ TRỢ -->
        <section id="page-support" class="page">
            <h2 class="page-title">
                Liên hệ <span class="gradient-admin">Admin</span>
            </h2>
            <div class="qr-wrapper">
                <div class="rgb-box">
                    <img src="QR/IMG_0003.jpeg" alt="Mã QR Zalo Admin" class="qr-img" onerror="this.src='https://via.placeholder.com/250?text=QR+Zalo+Admin'">
                </div>
            </div>
        </section>
    </main>

    <!-- FOOTER WEB -->
    <footer>
        2026 Hoang Apple 
    </footer>

    <!-- JAVASCRIPT XỬ LÝ SỰ KIỆN -->
    <script>
        // DOM Elements
        const htmlEl = document.documentElement;
        const bodyEl = document.body;
        const mainLogo = document.getElementById('mainLogo');
        const menuLogo = document.getElementById('menuLogo');
        const openMenuBtn = document.getElementById('openMenuBtn');
        const sideMenu = document.getElementById('sideMenu');
        const menuOverlay = document.getElementById('menuOverlay');
        const darkModeToggle = document.getElementById('darkModeToggle');
        const midAutumnToggle = document.getElementById('midAutumnToggle');

        // --- 1. XỬ LÝ MENU TRƯỢT ---
        function toggleMenu(open) {
            if (open) {
                sideMenu.classList.add('active');
                menuOverlay.classList.add('active');
            } else {
                sideMenu.classList.remove('active');
                menuOverlay.classList.remove('active');
            }
        }

        openMenuBtn.addEventListener('click', () => toggleMenu(true));
        menuOverlay.addEventListener('click', () => toggleMenu(false));

        // --- 2. CHUYỂN TRANG (NAVIGATION) ---
        function switchPage(pageId) {
            // Hide all pages
            document.querySelectorAll('.page').forEach(page => page.classList.remove('active'));
            // Remove active style on menu items
            document.querySelectorAll('.menu-item').forEach(item => item.classList.remove('active'));

            // Show selected page
            const targetPage = document.getElementById(`page-${pageId}`);
            if (targetPage) {
                targetPage.classList.add('active');
            }

            // Highlight menu item
            const activeIndex = pageId === 'home' ? 0 : pageId === 'guide' ? 1 : 2;
            document.querySelectorAll('.menu-item')[activeIndex].classList.add('active');

            // Close sidebar
            toggleMenu(false);
        }

        // --- 3. XỬ LÝ LIGHT / DARK MODE & ĐỔI LOGO ---
        function updateLogo(isDark) {
            const logoPath = isDark ? './logo/logo-darkmode.png' : './logo/logo-lightmode.png';
            mainLogo.src = logoPath;
            menuLogo.src = logoPath;
        }

        darkModeToggle.addEventListener('change', (e) => {
            const isDark = e.target.checked;
            if (isDark) {
                htmlEl.setAttribute('data-theme', 'dark');
            } else {
                htmlEl.setAttribute('data-theme', 'light');
            }
            updateLogo(isDark);
        });

        // --- 4. XỬ LÝ HIỆU ỨNG TẾT TRUNG THU ---
        midAutumnToggle.addEventListener('change', (e) => {
            if (e.target.checked) {
                bodyEl.classList.add('mid-autumn-mode');
            } else {
                bodyEl.classList.remove('mid-autumn-mode');
            }
        });
    </script>
</body>
</html>
